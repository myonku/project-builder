# 集成测试依赖：PostgreSQL 16 / Redis 7 / MongoDB / Mailpit
#
# 端口与凭据集中在 docker/test.env，并被集成测试的默认 DSN
# （internal/testsupport）与 Makefile 的测试目标复用，因此同一套依赖
# 可以被反复重建而不必改代码或配置。
#
# 用法：
#   docker compose --env-file docker/test.env -f docker/compose.test.yml up -d
#   docker compose --env-file docker/test.env -f docker/compose.test.yml down

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_builder_test}
      POSTGRES_USER: ${POSTGRES_USER:-project_builder_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_builder_test_password}
      # 迁移与集成测试需要稳定的排序与错误信息语言。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - project_builder_go_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - project_builder_test

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-project_builder_test_redis_password}
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - project_builder_go_test_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-project_builder_test_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - project_builder_test

  # MongoDB 9.0.4 仅供 GridFS 附件/头像测试；默认端口 27018，避免与本机 27017 冲突。
  mongo:
    image: mongo:9.0.4
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - project_builder_go_test_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - project_builder_test

  # Mailpit 供 Reminders 的邮件集成测试使用：把 mail.host/port 指向它即可
  # 在不外发的前提下观察真实投递结果（SMTP 127.0.0.1:11025，Web 127.0.0.1:18025）。
  # 注意：scripts/smoke.ps1 断言的是"邮件未启用 → skipped"，因此冒烟不要指向 Mailpit
  # （见 backend/docs/B05 §7.0.1 第 4 条坑）。
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "${MAIL_SMTP_PORT:-11025}:1025"
      - "${MAIL_WEB_PORT:-18025}:8025"
    networks:
      - project_builder_test

volumes:
  project_builder_go_test_postgres:
  project_builder_go_test_redis:
  project_builder_go_test_mongo:

networks:
  project_builder_test:
    driver: bridge
