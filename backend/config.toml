# 项目/计划管理系统 Go 服务端配置（本地开发默认值）
#
# 优先级（低 → 高）：代码默认值 < config.toml < 环境变量/部署注入
# 配置只在启动阶段读取一次，解析校验后成为不可变对象注入各模块。
# 敏感值（password / session_secret / MAIL_PASSWORD）不得写入本文件，请用 .env 或部署注入。

API_VERSION = "1"

[server]
host = "127.0.0.1"
port = 8000
read_timeout_seconds = 15
write_timeout_seconds = 30
shutdown_timeout_seconds = 10
# 允许的浏览器来源。内部网络默认只放行本机前端；不得使用 ["*"] 配合 credentials。
cors_allowed_origins = ["http://127.0.0.1:5173", "http://localhost:5173"]

[database]
host = "localhost"
port = 5432
name = "project_builder"
user = "project_builder"
password = ""
ssl_mode = "disable"
max_conns = 10
min_conns = 1
max_conn_lifetime_seconds = 1800
connect_timeout_seconds = 10

[redis]
# Redis 只承担会话、限流与短期锁，不保存核心业务唯一数据。
enabled = true
host = "localhost"
port = 6379
db = 0
password = ""
dial_timeout_seconds = 5

[mongo]
# MongoDB 9 只存附件/头像字节（GridFS）；PostgreSQL 仍是唯一业务事实源。
# 本地开发使用 local 后端时不会连接 Mongo；切到 storage.backend = "gridfs" 才会连接。
uri = "mongodb://127.0.0.1:27017"
database = "worklane"
connect_timeout_seconds = 10
server_selection_timeout_seconds = 5
max_pool_size = 20

[mail]
password_reset_url_template = "http://localhost:5173/reset-password?token={token}"
# 邮件默认关闭。启用需要同时提供账号、密码与发件地址，
# 且**凭据不要写在这个文件里**（它已入库）：用环境变量注入
#   MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM_ADDRESS
# 目标服务商是**阿里邮箱**（2026-10-12 实测投递成功）：
#   * SMTP 服务器 smtp.qiye.aliyun.com，**SSL 端口 465 + 直接 TLS**
#     （阿里邮箱未开放 587/80，非加密只有 25）→ implicit_tls = true、use_tls = false；
#   * 认证机制 login（实测可用）；密码用"三方客户端安全密码"，不是邮箱登录密码；
#   * 详见 backend/docs/B03-配置与运行.md 3.5.1。
enabled = false
host = "smtp.qiye.aliyun.com"
port = 465
username = ""
password = ""
from_address = ""
from_name = "项目计划管理系统"
use_tls = false
implicit_tls = true
auth_method = "login"
# 邮件正文里的任务链接需要一个外部可达地址。
task_url_template = "http://localhost:5173/projects/{project_id}?taskId={task_id}"

[storage]
backend = "local"
local_root = "./data/uploads"
gridfs_bucket = "attachments"
avatar_bucket = "avatars"
avatar_max_file_size = 2097152
max_file_size = 10485760
# 附件模块启用时生效（见 backend/docs/B02-数据库模型与迁移.md 5.2 预留说明）。
max_files_per_user = 1000
# 允许上传的扩展名白名单（**含点号**，如 ".pdf"）。
# 空数组或 ["*"] 表示不限制。匹配忽略大小写。
allowed_extensions = [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".txt", ".csv", ".png", ".jpg", ".jpeg", ".zip"]

[security]
password_reset_enabled = true
password_reset_token_ttl_seconds = 1800
password_reset_cooldown_seconds = 604800
password_reset_window_seconds = 604800
password_reset_max_requests = 5
password_reset_ip_requests_per_hour = 10
# 生产环境必须通过 SECURITY_SESSION_SECRET 注入真实随机值。
session_secret = "dev-only-change-me"
session_ttl_seconds = 28800
password_min_length = 8
secure_cookies = false
session_cookie_name = "pb_session"
# 自助注册需要管理员审核（默认且生产必须为 true）：
# POST /auth/register 只写入 registration_requests，不创建 users。
registration_requires_approval = true

# 引导管理员（系统初始化时录入一个系统级后台账号）。
#
# 本系统面向内部小组，普通用户不需要管理员角色，因此不做分发：只在这里录入一个，
# 服务启动时确保它存在且是 admin。账号已存在时**只确保角色，绝不覆盖密码**，
# 因此下面的密码是**一次性**的，账号建好后即可从环境中移除。
#
# 4 项必须整组配置或全部留空；只配一部分会导致启动失败（避免"看起来配了"的空配置）。
# bootstrap_admin_username = "admin"
# bootstrap_admin_email = "admin@example.com"
# bootstrap_admin_password = ""          # 通过 SECURITY_BOOTSTRAP_ADMIN_PASSWORD 注入，不写入仓库
# bootstrap_admin_display_name = "系统管理员"

[ratelimit]
# 全局 HTTP 限流（按来源地址分桶的令牌桶，单实例内存态）。
#
# 定位是"封顶"而不是精确配额：默认值刻意宽松，让正常使用（含 182 项端到端冒烟）
# 永远不会看到 429；它挡的是脚本化的高频刷取与登录口令尝试。
# 不做用户/会话级限流：按会话限流在登录之前就失效（见 backend/docs/B03-配置与运行.md 3.8）。
enabled = true
requests_per_minute = 3000
burst = 300

[scheduler]
enabled = true
interval_seconds = 60
reminder_batch_size = 100
max_retries = 1
